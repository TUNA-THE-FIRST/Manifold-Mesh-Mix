# Builds and tests Mesh Mix-S2C on Linux, Windows and macOS.
#
# Every push: build all three, run the unit tests, the engine test suite on
# the built engine, the app's scripted self-test (real conversions and
# exports, with screenshots) and the self-update tests.
# A tag like v1.2.3 also publishes a GitHub Release with the three
# downloads and SHA256SUMS.txt; the apps' updaters look for those. So does
# "Run workflow" with "publish" ticked (GitHub then creates the tag for the
# version in VERSION itself): on main for a normal release, on the branch
# "prerelease" for a test build (a VERSION like 2.0.0-test.1), published as a
# GitHub pre-release, which the apps never offer as an update.
name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in VERSION as a GitHub release (a normal release from main; a test build such as 2.0.0-test.1 from the branch prerelease, as a pre-release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # the engine suite: a few CAD and organic models, both presets
  SUITE_MODELS: cad_bracket,cad_cylinder,organic_metaballs,messy_open_box

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt
      - name: System libraries for Qt and the display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 fonts-dejavu-core desktop-file-utils
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r desktop/requirements.txt
      - name: Lint
        run: .venv/bin/python -m pyflakes desktop
      - name: Unit tests
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python -m pytest -q desktop/tests
      - name: Engine unit tests
        run: .venv/bin/python -E -s -m pytest -q tests/engine
      - name: Merged engine smoke test
        run: .venv/bin/python -E -s tests/smoke_merged.py smoke
      - name: Test models
        run: |
          .venv/bin/python tests/make_models.py
          .venv/bin/python desktop/tests/make_fixtures.py fixtures
          cp tests/models/cad_bracket_fillets.stl tests/models/organic_metaballs.stl fixtures/
      - name: Build (engine, app, AppImage)
        run: .venv/bin/python desktop/build.py
      - name: Engine test suite (built engine)
        run: >
          .venv/bin/python tests/run_suite.py --presets cad,smooth --only "$SUITE_MODELS"
          --engine dist-desktop/ManifoldMeshMix/engine/mmm-engine --reread --strict
      - name: App self-test (AppImage)
        run: >
          xvfb-run -a -s "-screen 0 1600x1000x24"
          .venv/bin/python desktop/tests/run_selftest.py dist-desktop/MeshMix-S2C-*-Linux-x86_64.AppImage selftest-linux
          --files fixtures/cad_bracket_fillets.stl fixtures/two_parts.3mf "fixtures/Peça ção teste.stl" fixtures/organic_metaballs.stl "fixtures/Messy cube.stl"
          --big tests/models/huge_scan_blob.stl
      - name: Self-update test (AppImage)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" .venv/bin/python desktop/tests/appimage_update_test.py dist-desktop/MeshMix-S2C-*-Linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-desktop/MeshMix-S2C-*-Linux-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-selftest-screenshots
          path: selftest-linux
          if-no-files-found: ignore

  windows:
    name: Windows (installer)
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements.txt
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.txt -r desktop/requirements.txt
      - name: Lint
        run: .venv/Scripts/python.exe -m pyflakes desktop
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python.exe -m pytest -q desktop/tests
      - name: Engine unit tests
        run: .venv/Scripts/python.exe -E -s -m pytest -q tests/engine
      - name: Test models
        run: |
          .venv/Scripts/python.exe tests/make_models.py
          .venv/Scripts/python.exe desktop/tests/make_fixtures.py fixtures
          cp tests/models/cad_bracket_fillets.stl tests/models/organic_metaballs.stl fixtures/
      - name: Build (engine, app, installer)
        run: .venv/Scripts/python.exe desktop/build.py
      - name: Engine test suite (built engine)
        run: >
          .venv/Scripts/python.exe tests/run_suite.py --presets cad,smooth --only "$SUITE_MODELS"
          --engine dist-desktop/ManifoldMeshMix/engine/mmm-engine.exe --reread --strict
      - name: App self-test (built app, temporary folder with accents)
        run: >
          .venv/Scripts/python.exe desktop/tests/run_selftest.py dist-desktop/ManifoldMeshMix/ManifoldMeshMix.exe selftest-windows
          --unicode-temp
          --files fixtures/cad_bracket_fillets.stl fixtures/two_parts.3mf "fixtures/Peça ção teste.stl" fixtures/organic_metaballs.stl "fixtures/Messy cube.stl"
          --big tests/models/huge_scan_blob.stl
      - name: Install, self-update and uninstall test
        run: .venv/Scripts/python.exe desktop/tests/windows_update_test.py dist-desktop/MeshMix-S2C-*-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-desktop/MeshMix-S2C-*-Windows-x64-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest-screenshots
          path: selftest-windows
          if-no-files-found: ignore

  macos:
    name: macOS (app)
    runs-on: macos-15   # (builds for macOS 14+: see build.sh -target; macos-14 jobs were cancelled at start on 2026-10-31)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Test models
        run: |
          .venv/bin/python tests/make_models.py
          .venv/bin/python desktop/tests/make_fixtures.py fixtures
          cp tests/models/cad_bracket_fillets.stl tests/models/organic_metaballs.stl fixtures/
      - name: Build (app + engine + zip)
        run: ./build.sh --zip
      - name: App self-test
        run: >
          python3 desktop/tests/run_selftest.py "dist/Mesh Mix-S2C.app/Contents/MacOS/ManifoldMeshMix" selftest-macos
          --files fixtures/cad_bracket_fillets.stl fixtures/two_parts.3mf "fixtures/Peça ção teste.stl" fixtures/organic_metaballs.stl "fixtures/Messy cube.stl"
          --big tests/models/huge_scan_blob.stl
      - name: Self-update test
        run: python3 app/Tests/update_test.py "dist/Mesh Mix-S2C.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: dist/MeshMix-S2C-*-macOS-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-selftest-screenshots
          path: selftest-macos
          if-no-files-found: ignore

  release:
    name: Publish release
    # a normal release only from main; a test build (VERSION like 2.0.0-test.1)
    # only from the branch "prerelease", as a pre-release (checked in the first step)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "v$v" != "$tag" ]; then
              echo "The tag $tag doesn't match VERSION ($v)"; exit 1
            fi
          else
            tag="v$v"
            case "${GITHUB_REF}:$v" in
              refs/heads/main:*-*)
                echo "Test builds ($v) are published from the branch prerelease, not main"; exit 1 ;;
              refs/heads/main:*) ;;
              refs/heads/prerelease:*-*) ;;
              refs/heads/prerelease:*)
                echo "The branch prerelease publishes test builds only: VERSION needs a suffix like $v-test.1"; exit 1 ;;
              *)
                echo "Releases are published from main (normal) or prerelease (test builds), not ${GITHUB_REF#refs/heads/}"; exit 1 ;;
            esac
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already published; raise VERSION first"; exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the downloads
        run: |
          mkdir release
          cp artifacts/linux-appimage/*.AppImage artifacts/windows-installer/*.exe artifacts/macos-zip/*.zip release/
      - name: Checksums
        working-directory: release
        run: |
          ls -la
          test "$(ls | wc -l)" -eq 3
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # hand-written notes for this version if there are any (they also
          # show in the apps' update window), else a list of the changes
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then how=(--notes-file "$notes"); else how=(--generate-notes); fi
          # test builds (2.0.0-test.1) are pre-releases: the apps' updaters
          # only offer normal releases
          case "$TAG" in *-*) how+=(--prerelease) ;; esac
          gh release create "$TAG" release/* --target "$GITHUB_SHA" \
            --title "Mesh Mix-S2C ${TAG#v}" "${how[@]}"
